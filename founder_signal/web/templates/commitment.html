{% extends "base.html" %}

{% block content %}
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:1.75rem">
    <div style="display:flex; align-items:center; gap:0.75rem">
      <a href="{{ url_for('index') }}" class="btn btn-outline btn-sm">← Back to Cockpit</a>
      <h2 class="section-title" style="margin:0">Edit Commitment</h2>
    </div>
    <span class="badge badge-{{ commitment.status }}">{{ commitment.status }}</span>
  </div>

  <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:1.75rem; align-items:start">
    <div class="card">
      <form method="post">
        <label for="field-description">Description</label>
        <textarea id="field-description" name="description" rows="3" required>{{ commitment.description }}</textarea>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.85rem">
          <div>
            <label for="field-owner">Owner</label>
            <input type="text" id="field-owner" name="owner" value="{{ commitment.owner or '' }}" placeholder="e.g. co-founder">
          </div>
          <div>
            <label for="field-due-date">Due date</label>
            <input type="date" id="field-due-date" name="due_date" value="{{ commitment.due_date or '' }}">
          </div>
        </div>

        <label for="field-status">Status</label>
        <select id="field-status" name="status">
          <option value="open" {% if commitment.status == 'open' %}selected{% endif %}>Open</option>
          <option value="done" {% if commitment.status == 'done' %}selected{% endif %}>Done</option>
          <option value="waiting" {% if commitment.status == 'waiting' %}selected{% endif %}>Waiting</option>
          <option value="deferred" {% if commitment.status == 'deferred' %}selected{% endif %}>Deferred</option>
          <option value="ignore" {% if commitment.status == 'ignore' %}selected{% endif %}>Ignore</option>
        </select>

        <label for="field-evidence">Evidence (verbatim quote from source)</label>
        <textarea id="field-evidence" name="evidence" rows="4">{{ commitment.evidence }}</textarea>

        <input type="hidden" name="source_id" value="{{ commitment.source_id }}">

        <div style="display:flex; gap:0.65rem; margin-top:0.75rem; flex-wrap:wrap">
          <button type="submit" name="action" value="update" class="btn">Save Changes</button>
          <button type="submit" name="action" value="confirm" class="btn btn-outline">Confirm (No Change)</button>
        </div>
      </form>
    </div>

    {% if source %}
    <aside class="source-preview-card" aria-label="Original Source Verification">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem">
        <h3 style="margin:0; font-family:var(--font-serif); font-size:1.15rem; color:var(--color-text)">{{ source.title }}</h3>
        <span class="source-chip">{{ source.kind }}</span>
      </div>
      <div style="font-size:0.75rem; color:var(--color-text-secondary); margin-bottom:0.75rem; word-break:break-all">
        <code style="font-family:var(--font-mono)">{{ commitment.source_id }}</code>
      </div>
      <div class="source-preview-body">{{ source.body[:700] }}{% if source.body|length > 700 %}…{% endif %}</div>
    </aside>
    {% endif %}
  </div>
{% endblock %}
