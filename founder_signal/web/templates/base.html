<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Founder Signal</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f7f8fa; color: #1f2937; }
    header { background: #111827; color: #fff; padding: 1rem 1.5rem; }
    header h1 { margin: 0; font-size: 1.25rem; letter-spacing: -0.02em; }
    header a { color: #93c5fd; text-decoration: none; margin-left: 1rem; font-size: 0.9rem; }
    header a:hover { text-decoration: underline; }
    .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .card h2 { margin: 0 0 0.75rem 0; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; }
    .stat { font-size: 1.75rem; font-weight: 700; color: #111827; }
    .stat small { font-size: 0.75rem; font-weight: 400; color: #6b7280; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid #e5e7eb; }
    th { background: #f3f4f6; font-size: 0.8rem; text-transform: uppercase; color: #6b7280; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 4px; text-transform: uppercase; }
    .badge-open { background: #dbeafe; color: #1e40af; }
    .badge-done { background: #d1fae5; color: #065f46; }
    .badge-waiting { background: #fef3c7; color: #92400e; }
    .badge-deferred { background: #e5e7eb; color: #374151; }
    .badge-ignore { background: #f3f4f6; color: #6b7280; }
    .evidence { font-size: 0.8rem; color: #6b7280; font-style: italic; margin-top: 0.25rem; }
    .btn { background: #111827; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .btn:hover { background: #1f2937; }
    .btn-sm { padding: 0.2rem 0.5rem; font-size: 0.75rem; }
    .btn-outline { background: transparent; border: 1px solid #111827; color: #111827; }
    .btn-outline:hover { background: #111827; color: #fff; }
    .flash { padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
    .flash-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .flash-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .flash-warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    form label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; color: #374151; }
    textarea, input[type="text"], input[type="date"], select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9rem; margin-bottom: 0.75rem; }
    .section { margin-bottom: 2rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.5rem; color: #111827; border-bottom: 2px solid #111827; display: inline-block; }
    .empty { color: #9ca3af; font-style: italic; font-size: 0.9rem; }
    .source-chip { display: inline-block; background: #e5e7eb; color: #374151; font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 3px; margin-right: 0.4rem; text-transform: uppercase; }
  </style>
</head>
<body>
  <header>
    <h1>🔔 Founder Signal</h1>
    <a href="{{ url_for('index') }}">Dashboard</a>
    <a href="{{ url_for('briefing_view') }}">Briefing</a>
    <a href="{{ url_for('ingest') }}">Ingest</a>
  </header>

  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
